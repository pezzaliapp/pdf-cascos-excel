<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>PDF Catalog Generator PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <h1>PDF Catalog Generator PRO</h1>

  <div class="upload-box">
    <label>Carica Excel</label>
    <input type="file" id="excelFile" accept=".xlsx,.xls">
  </div>

  <div class="upload-box">
    <label>PDF con pedana</label>
    <input type="file" id="pdf1">
  </div>

  <div class="upload-box">
    <label>PDF senza pedana</label>
    <input type="file" id="pdf2">
  </div>

  <button id="generateBtn">Genera PDF Professionale</button>

  <p id="status"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>
</body>
</html>
